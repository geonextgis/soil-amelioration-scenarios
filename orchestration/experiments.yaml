# Master orchestration config for the soil-amelioration scenario experiments.
#
# This is the single human-readable control surface. `generate.py` reads it to
# build, per experiment, an isolated run directory containing:
#   project/project.csv      (period + grid + vIDPL management)
#   project/project.proj.xml  (weather-interface path + divider for the climate source)
#   data/soil/soil.csv        (the chosen soil scenario)
#   config.yaml               (the `cluster:` block the existing runner consumes)
#
# Experiment matrix = 17 climate scenarios x 5 soil scenarios = 85 per crop.

# Repo root. `auto` derives it from this file's location, so the checkout can be
# moved or cloned anywhere without editing config. Override with an absolute path
# here or via the SOIL_SCENARIOS_ROOT env var.
repo_root: auto

paths:
  point_grid: data/raw/point_to_nearest_grid.csv # PointID -> nearest grid cell
  soil_dir: data/raw/soil_scenarios # <SOIL>_BZE.csv files
  runs_subdir: runs # simplace/<crop>/runs/<exp_id>/

# The five phenology/LAI/yield-calibrated crops.
crops: [winter_wheat, winter_rapeseed, spring_barley, potato, maize]

# Soil scenarios. Files are <SOIL>_BZE.csv in paths.soil_dir. S1 is the baseline.
soils: [S1, S2, S3, DL, DLB]

# Climate sources -----------------------------------------------------------
climate_dwd: /beegfs/common/data/climate/dwd/csvs/germany_ubn_1951-01-01_to_2024-08-30
climate_root_hyras: /data01/FDS/muduchuru/Atmos/NEXGDDP_HYRAS_BC_CSV
gcms: [ACCESS-CM2, CanESM5, EC-Earth3, GFDL-ESM4, MIROC6]

# Period table (inclusive years) + the date-string baked into HYRAS filenames.
periods:
  historical: { start: 1951, end: 2014, datestr: "19510101_20141231" }
  future: { start: 2015, end: 2100, datestr: "20150101_21001231" }

# SLURM / Singularity defaults for the generated `cluster:` blocks.
slurm:
  singularity_image: /beegfs/common/singularity/simplace/simplace_5.0-3897.sif
  partition: compute
  walltime: "03:00:00"
  num_nodes: 50 # per experiment; sized so many experiments can run concurrently
  num_tasks_per_node: 8
  cpus_per_node: 80 # cores per compute node; sets cpus-per-task = this / tasks
  # Size of the partition. Each runner blocks until its own jobs finish, so the
  # generated submit script drives cluster_nodes // num_nodes experiments at a
  # time instead of launching all of them and oversubscribing the queue.
  cluster_nodes: 100

  # --- Single-allocation campaign -------------------------------------------
  # generate.py also writes campaign_<label>_<hash>.sbatch: ONE allocation of
  # campaign_nodes, held from the first experiment to the last. Every experiment
  # runs inside it as srun job steps (simplace_runner_cluster.py --mode alloc),
  # so nodes are never handed back and re-queued between experiments — which on
  # a busy partition is where most of the wall-clock goes.
  #
  # The trade-off is the allocation itself: it starts only once campaign_nodes
  # are free simultaneously, and campaign_walltime must cover every experiment
  # end to end (they run one after another, each using the full allocation).
  # Whatever the walltime does not reach is picked up by
  #   sbatch --export=ALL,SIMPLACE_RESUME=1 campaign_....sbatch
  # which skips experiments that wrote a completion marker.
  campaign_nodes: 50 # held for the whole campaign; <= cluster_nodes
  campaign_walltime: "24:00:00"
  # Memory per CPU for the allocation. Must be set: without it the first srun
  # step on a node claims the node's whole memory and the other
  # num_tasks_per_node steps stall behind it inside our own allocation.
  # compute nodes have 95000M / 80 cores.
  mem_per_cpu: 1100M
