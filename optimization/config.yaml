# Configuration for the single-trial SIMPLACE calibration scripts.
#
#   optimization/optimize_phenology.py
#   optimization/optimize_lai.py
#   optimization/optimize_yield.py
#
# Each script run = ONE trial (one parameter draw -> one SIMPLACE run -> one loss).
# Trial history lives in optimization/studies/<crop>__<target>.db, so repeated runs
# (e.g. under Claude Loop) keep improving instead of restarting from scratch.
#
# Nothing here is read by the existing simplace/<crop>/config.yaml pipeline; the
# calibration runs are fully isolated under simplace/<crop>/runs_optim/<target>/.

repo_root: /beegfs/halder/GITHUB/RESEARCH/soil-amelioration-scenarios

# Climate driving the calibration runs (DWD observations = the baseline source).
climate:
  mount_data: /beegfs/common/data/climate/dwd/csvs/germany_ubn_1951-01-01_to_2024-08-30

slurm:
  singularity_image: /beegfs/common/singularity/simplace/simplace_5.0-3897.sif
  partition: compute
  walltime: "03:00:00"
  num_nodes: 30
  num_tasks_per_node: 8
  debug: false

optuna:
  sampler: tpe # tpe | random
  seed: 42
  n_startup_trials: 10 # random draws before TPE starts modelling
  # The very first trial of a fresh study is the current crop.xml values, so every
  # later trial has a reference loss to beat.
  enqueue_baseline: true

# Which input tables get staged into the calibration run dir under the canonical
# names the solution reads (data/soil/soil.csv, data/management/location.csv,
# data/management/fertilizer_<crop>.csv). `lai` falls back to `production` when a
# crop has no *_LAI variants on disk.
input_profiles:
  production:
    soil: data/soil/soil.csv
    location: data/management/location.csv
    fertilizer: data/management/fertilizer_{crop}.csv
  lai:
    soil: data/soil/soil_{crop}_LAI.csv
    location: data/management/location_{crop}_LAI.csv
    fertilizer: data/management/fertilizer_{crop}_LAI.csv

# ---------------------------------------------------------------------------
# Targets. `parameters` uses the same schema as simplace/<crop>/config.yaml.
# ---------------------------------------------------------------------------
targets:
  phenology:
    exp_name: OPTIM_PHENOLOGY
    project_csv: project/project_{crop}.csv
    inputs: production
    # Thermal-time drivers only: these move anthesis/maturity without touching growth.
    parameters:
      single_value_params:
        TSUM1:
          type: int
          low: 700
          high: 1500
        TSUM2:
          type: int
          low: 700
          high: 1500
        TEFFMX:
          type: float
          low: 25.0
          high: 40.0
          precision: 2
      multi_value_params: null
    # Subset keeps a trial cheap enough to iterate on. null = use everything.
    subset:
      n_locations: 300
      year_start: 1995
      year_end: 2022

  lai:
    exp_name: OPTIM_LAI
    # Prebuilt LAI calibration table: one row per GLASS-LAI point, 2-year window
    # matched to that point's observations. Its point set (and grid) differs from
    # the baseline project table, hence the `lai` input profile.
    project_csv: project/project_{crop}_LAI.csv
    inputs: lai
    parameters:
      single_value_params:
        RGRLAI:
          type: float
          low: 0.018
          high: 0.028
          precision: 5
        RDRNS:
          type: float
          low: 0.002
          high: 0.05
          precision: 3
      multi_value_params:
        SLATableSLA:
          type: float
          values:
            - { low: 0.008, high: 0.012 } # DVS 0.00  emergence
            - { low: 0.012, high: 0.020 } # DVS 0.25  tillering
            - { low: 0.012, high: 0.018 } # DVS 0.50  stem elongation
            - { low: 0.012, high: 0.018 } # DVS 1.00  anthesis
            - { low: 0.010, high: 0.018 } # DVS 1.25  grain filling start
            - { low: 0.010, high: 0.016 } # DVS 1.50  grain filling mid
            - { low: 0.008, high: 0.014 } # DVS 1.75  grain filling end
            - { low: 0.008, high: 0.014 } # DVS 2.00  maturity
          precision: 4
    subset:
      n_locations: 400
      year_start: null
      year_end: null

  yield:
    exp_name: OPTIM_YIELD
    project_csv: project/project_{crop}.csv
    inputs: production
    parameters:
      single_value_params:
        YieldAdjustRatio:
          type: float
          low: 0.80
          high: 1.20
          precision: 2
        FreshratioStorageOrgan:
          type: float
          low: 0.80
          high: 0.90
          precision: 2
      multi_value_params:
        # Upper bounds sit above the current crop.xml values (4.2, 4.2, 3.2, 1.2)
        # so the baseline trial is inside the search space.
        RUETableRUE:
          type: float
          values:
            - { low: 2.0, high: 4.5 } # DVS 0.0  emergence
            - { low: 2.0, high: 4.5 } # DVS 1.0  anthesis
            - { low: 1.5, high: 3.5 } # DVS 1.3  mid grain filling
            - { low: 0.0, high: 1.5 } # DVS 2.0  maturity
          precision: 2
    subset:
      n_locations: 400
      year_start: 1995
      year_end: 2023

# ---------------------------------------------------------------------------
# Crops. `crop_name` must match the <parameter id="CropName"> in data/crop/crop.xml.
# `dm_fraction` puts *observed* yield on the model's dry-matter basis (1.0 = the
# observations are already dry matter).
# `targets:` here overrides the global target block for this crop only.
# ---------------------------------------------------------------------------
crops:
  winter_wheat:
    crop_name: winter_wheat
    dm_fraction: 1.0

  winter_rapeseed:
    crop_name: winter_rapeseed
    dm_fraction: 1.0

  spring_barley:
    crop_name: spring_barley
    dm_fraction: 1.0

  potato:
    crop_name: potato
    # Observed potato yield is fresh tuber weight (~33 t/ha) vs dry-matter sim
    # (~5.5 t/ha); without this the yield loss would chase a units mismatch.
    dm_fraction: 0.21

  maize:
    crop_name: maize
    dm_fraction: 1.0
